name: Reproducibility failure
description: Report a failure to reproduce an audit, test, CI job, or receipt.
title: "[REPRO] "
labels: []
body:
  - type: input
    id: commit
    attributes:
      label: Commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python version, SymPy version, pytest version, or Lean toolchain.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full failure output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
