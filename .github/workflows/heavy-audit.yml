name: OPAC-016 Heavy Exact Audit

on:
  workflow_dispatch:

jobs:
  heavy-exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned referee environment
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Record environment
        run: |
          mkdir -p receipts/heavy-run
          python --version | tee receipts/heavy-run/python-version.txt
          python -c "import sympy,pytest; print('sympy='+sympy.__version__); print('pytest='+pytest.__version__)" | tee receipts/heavy-run/package-versions.txt
          uname -a | tee receipts/heavy-run/system.txt
          git rev-parse HEAD | tee receipts/heavy-run/commit.txt
      - name: Run exact C2-C6 subspace audit
        run: python audit/exact_subspace_audit.py | tee receipts/heavy-run/exact-subspace-audit.log
      - name: Run formula elimination
        run: python audit/formula_elimination.py | tee receipts/heavy-run/formula-elimination.log
      - name: Hash programs and generated receipts
        run: |
          sha256sum audit/exact_subspace_audit.py audit/formula_elimination.py receipts/*.json > receipts/heavy-run/SHA256SUMS.txt
      - name: Upload heavyweight audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: opac016-heavy-audit-${{ github.sha }}
          path: receipts/heavy-run/
