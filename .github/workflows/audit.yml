name: OPAC-016 Exact Audit

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned referee environment
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Show versions
        run: |
          python --version
          python -c "import sympy,pytest; print('sympy='+sympy.__version__); print('pytest='+pytest.__version__)"
      - name: Compile Python
        run: python -m compileall -q audit tests
      - name: Run fast exact audit
        run: python audit/fast_adversarial_audit.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify source and receipt hashes
        run: sha256sum -c receipts/SHA256SUMS.txt
      - name: Check truth-boundary language
        run: |
          grep -Fq 'PROVED_EXACT' README.md
          grep -Fq 'does **not** claim that global OPAC-018 is solved' README.md
          grep -Fq 'global OPAC-018 is solved' CLAIMS_AND_NONCLAIMS.md
