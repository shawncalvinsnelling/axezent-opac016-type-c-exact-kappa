name: OPAC-016 Exact Audit

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q audit tests
      - name: Run fast exact audit
        run: python audit/fast_adversarial_audit.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check truth-boundary language
        run: |
          grep -q 'PROVED_EXACT' README.md
          grep -q 'does \*\*not\*\* claim that global OPAC-018 is solved' docs/REFEREE_RELEASE.md
