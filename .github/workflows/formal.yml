name: OPAC-016 Lean Formal Kernel

on:
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  push:
    branches: [ main ]
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  workflow_dispatch:

jobs:
  lean-formal-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan / pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib dependencies
        working-directory: formal
        run: |
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get
      - name: Reject placeholders and project axioms in every project theorem
        working-directory: formal
        run: |
          if grep -nE '\bsorry\b|^[[:space:]]*axiom\b' OPAC016*.lean; then
            echo 'Lean placeholders/project axioms are not allowed anywhere in OPAC-016 formal source.'
            exit 1
          fi
      - name: Build complete current OPAC-016 formal kernel
        working-directory: formal
        run: "$HOME/.elan/bin/lake build"
